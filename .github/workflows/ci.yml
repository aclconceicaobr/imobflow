name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de mentira só para o build validar o formato. Nenhum é segredo:
      # as chaves do Turnstile são as de teste públicas da Cloudflare.
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      SUPABASE_SECRET_KEY: sb_secret_ci
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Checagem de tipos
        run: pnpm typecheck
      - name: Testes unitários
        run: pnpm test
      - name: Build
        run: pnpm build

  database:
    name: Banco (migrações e pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Subir Postgres descartável
        run: pnpm exec supabase db start
      - name: Aplicar migrações do zero
        run: pnpm exec supabase db reset --local
      - name: Testes pgTAP (RLS e permissões)
        run: pnpm test:db
